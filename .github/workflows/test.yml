name: Shorts production checks
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-noto-core libraqm0
      - run: python -m pip install -r requirements-voice.txt
      - run: python -m unittest -v test_production test_system test_dialogue test_hindi test_automation
      - run: SHORTS_VOICE_MODEL_DIR=/tmp/voice-models python download_voice_models.py
      - run: SHORTS_ASR_MODEL_DIR=/tmp/asr-model python download_asr_model.py
      - name: Real narrated media test
        env:
          SHORTS_VOICE_MODEL_DIR: /tmp/voice-models
          SHORTS_ASR_MODEL_DIR: /tmp/asr-model
          OMP_NUM_THREADS: 1
          OPENBLAS_NUM_THREADS: 1
        run: |
          python - <<'PY'
          from story_feed import plans
          from renderer import render
          result = render(plans()[0], '/tmp/shorts-ci')
          assert result['full_decode'] and result['audio'] and result['language_validated']
          assert 12 <= result['duration'] <= 60
          print(result)
          PY
